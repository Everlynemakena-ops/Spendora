<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>


<link rel="stylesheet" href="bootsrap/css/bootstrap.min.css">
<link rel="stylesheet" href="bootsrap/js/bootstrap.min.js">



</head>
<body class=" container bg-body-secondary bg d-flex align-items-center justify-content-center min-vh-100">
    

<div class="container mt-3">
    <div class=" row justify-content-center"></div>
    <div class="col-12 col-md-6 col-lg-4"></div>
    
    


    <!---login card----->
    <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5 bg-white">
        <div class="text-center mb-4">
 <h2 class="fw-bold text-dark mb-1">Welcome To Jyma Computers</h2>
<p class="text-success-emphasis">Please login to your account</p>
</div>





<form action="" class="bg-body-secondary">

<div class="mb-3 mt-3">
    

    <label for="email" class="form-label fw-semibold text-secondary">EMAIL:</label>
<input type="email" class="form-control form-control-lg text-bg-light border-0 " id="email"
 placeholder="eve@gmail.com">


</div>



<div class="mb-3 mt-3">

    <label for="password" class="form-label fw-semibold text-secondary">PASSWORD:</label>
<input type="password" class="form-control form-control-lg text-bg-light border-0 " id="password"
 placeholder="eve@gmail.com">


</div>


<div class="form-check mb-4">

    <input type="checkbox" class="form-check-input" id="rememberMe">
              <label class="form-check-label text-muted small" for="rememberMe">Remember me on this device</label>

</div>

<button class="btn btn-dark">LOGIN</button>


<a href="#" class="f-password"><u>Forgot password</u>

</a>

<!-- Footer Link -->
          <div class="text-center pt-2">
            <p class="text-muted small mb-0">Don't have an account? <a href="#" class="text-decoration-none fw-semibold text-primary">Register here</a></p>
          </div>
        </div>
        <!-- End Login Card -->







        
</form>



</body>
</html>
